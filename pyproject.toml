[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "naamasetu"
version = "0.1.0"
description = "Cross-lingual NER label projection for Indic languages via hybrid word alignment"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
